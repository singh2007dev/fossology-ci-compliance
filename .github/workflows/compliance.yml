name: License Compliance Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compliance-check:
    name: Run FOSSology Compliance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Create Source Archive
        run: python3 create_source_archive.py --output source_archive.zip

      - name: Run FOSSology CI Compliance Pipeline
        env:
          FOSSOLOGY_URL: ${{ secrets.FOSSOLOGY_URL }}
          FOSSOLOGY_TOKEN: ${{ secrets.FOSSOLOGY_TOKEN }}
        run: |
          python3 -u run_ci_compliance.py --archive source_archive.zip --policy compliance_policy.json

      - name: Upload FOSSology findings reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: fossology-findings-${{ github.run_number }}
          path: |
            fossology_upload_*_findings.json
            fossology_upload_*_findings.csv
          if-no-files-found: ignore
